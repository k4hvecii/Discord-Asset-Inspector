name: Build

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.betterdiscord.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Verify BetterDiscord metadata header
        run: node -e "const fs=require('fs');const s=fs.readFileSync('plugins/betterdiscord/DiscordAssetInspector.plugin.js','utf8');if(!s.startsWith('/**'))process.exit(1)"
      - name: Commit generated distributions
        run: |
          if [ -z "$(git status --porcelain -- dist/ plugins/betterdiscord/)" ]; then
            echo "Generated distributions are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/discord-asset-inspector.js plugins/betterdiscord/DiscordAssetInspector.plugin.js
          git commit -m "build: refresh distributions"
          git push
